baseURL = 'https://blog.mare.run'
languageCode = 'en-us'
title = 'Mare Blog — Visual Reference Management'
theme = 'PaperMod'

[sitemap]
  filename = 'sitemap.xml'
  changefreq = 'weekly'
  priority = 0.5
  maxItems = 5000

[build]
  writeStats = true
  enableGitInfo = true

[related]
  maxAge = "720h"
  threshold = 30
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 60
  [[related.indices]]
    name = "keywords"
    weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'github'
    lineNos = true
    codeFences = true

[params]
  env = 'production'
  author = 'Mare'
  description = 'Expert guides on visual reference management, creative archiving, and design workflows for cultural creatives.'
  keywords = ['visual reference management', 'creative archiving', 'design workflow', 'pinterest alternative', 'are.na alternative']
  
  [params.analytics]
    google = { SiteVerificationTag = 'Vm8_OmT6GQ54auqldMgwWhRI00vLBxq-Us-Eu5V6SrM' }
  
  defaultTheme = 'auto'
  ShowShareButtons = true
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false
  
  assets = { favicon = '/favicon.ico', favicon16x16 = '/favicon-16x16.png', favicon32x32 = '/favicon-32x32.png', apple_touch_icon = '/apple-touch-icon.png', safari_pinned_tab = '/safari-pinned-tab.svg' }
  images = ['/images/og-default.png']
  
  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false
    linkFullImages = true
  
  [params.schema]
    enabled = true
    type = 'BlogPosting'
    publisher = 'Mare'
    publisherLogo = '/images/logo.png'
  
  [params.llms]
    enableTxt = true
  
  [params.profile]
    name = 'Mare'
    subtitle = 'Visual Reference Management for Cultural Creatives'
    imageUrl = '/images/mare-profile.png'
    imageTitle = 'Mare'
    buttons = [{ name = 'Try Mare', url = 'https://mare.run' }]
  
  [params.homeInfoParams]
    Title = 'Visual Reference Management'
    Content = 'Expert guides on organizing, retrieving, and using visual inspiration.'
  
  [params.footer]
    text = ""

[[params.socialIcons]]
  name = 'twitter'
  url = 'https://twitter.com/marevisual'
  
[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/mare-visual'

[[menu.main]]
  identifier = 'home'
  name = 'Home'
  url = '/'
  weight = 10
  
[[menu.main]]
  identifier = 'articles'
  name = 'Articles'
  url = '/posts/'
  weight = 20
  
[[menu.main]]
  identifier = 'tags'
  name = 'Topics'
  url = '/tags/'
  weight = 30
  
[[menu.main]]
  identifier = 'search'
  name = 'Search'
  url = '/search/'
  weight = 40

[taxonomies]
  tag = 'tags'
  category = 'categories'

[privacy]
  disqus = { disable = true }
  googleAnalytics = { disable = true }
  instagram = { disable = true }
  twitter = { disable = true }
  vimeo = { disable = true }
  youtube = { disable = true }

[outputs]
  home = ['HTML', 'RSS', 'JSON', 'LLMS']

[mediaTypes]
  [mediaTypes.'text/plain']
    suffixes = ['txt']

[outputFormats]
  [outputFormats.LLMS]
    mediaType = 'text/plain'
    baseName = 'llms'
    isPlainText = true
    notAlternative = true
